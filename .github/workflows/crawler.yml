name: Hongik Notice Crawler

on:
  schedule:
    - cron: '*/15 * * * *'  # 15분마다 자동으로 실행
  workflow_dispatch:        # 수동으로도 실행해 볼 수 있는 버튼 추가

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: 크롤러 실행
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: 변경된 최신 글 ID 저장소에 기록
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_post_id.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last_post_id" && git push)
